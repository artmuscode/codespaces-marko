services:

  # ── Database ──────────────────────────────────────────────────────────────
  # Uncomment one database service. Default credentials: root / root

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${MARKO_PROJECT_NAME:-app}
      MYSQL_USER: marko
      MYSQL_PASSWORD: marko
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: ${MARKO_PROJECT_NAME:-app}
  #     POSTGRES_USER: marko
  #     POSTGRES_PASSWORD: marko
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

  # ── Cache ─────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql-data:
  # postgres-data:
